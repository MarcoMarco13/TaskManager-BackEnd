# Configura\u00E7\u00E3o do Banco de Dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_tasks}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seguran\u00E7a e Servidor (com fallbacks garantidos)
api.security.token.secret=${JWT_SECRET:minha-chave-secreta-dev-local-123456789}
recaptcha.secret-key=${RECAPTCHA_SECRET:chave-recaptcha-dev-local}

server.address=0.0.0.0
server.port=${PORT:8080}