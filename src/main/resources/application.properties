# Banco de Dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_tasks}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

# Seguran\u00E7a e Servidor
api.security.token.secret=${JWT_SECRET:minha-chave-secreta-local}
recaptcha.secret-key=${RECAPTCHA_SECRET:chave-recaptcha-local}

server.address=0.0.0.0
server.port=${PORT:8080}