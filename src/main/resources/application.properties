# Configuração do Banco de Dados usando Variáveis de Ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_tasks}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# Segredo do JWT (O Spring busca do ambiente; se não achar, usa o valor após os dois pontos)
api.security.token.secret=${JWT_SECRET:minha-chave-secreta-super-segura-para-dev-local}

# Chave Secreta do reCAPTCHA
recaptcha.secret-key=${RECAPTCHA_SECRET}

# Configurações do Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect