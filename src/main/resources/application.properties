# Configura\u00E7\u00E3o do Banco de Dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_tasks}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# JPA / Hibernate (removida a linha de dialeto antigo)
spring.jpa.hibernate.ddl-auto=update

# Seguran\u00E7a e Servidor
api.security.token.secret=${JWT_SECRET:minha-chave-secreta-super-segura-para-dev-local}
recaptcha.secret-key=${RECAPTCHA_SECRET}

server.address=0.0.0.0
server.port=${PORT:8080}